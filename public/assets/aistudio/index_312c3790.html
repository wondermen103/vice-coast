<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Golden Hour Kings: Puerto Celeste</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles/hud.css">
    <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>

<body>
    <canvas id="view"></canvas>
    <div id="hud" class="hidden">
        <div id="mission-card" class="card hidden">
            <div class="mc-head"><span id="mission-job"></span><span id="mission-tag"></span><span id="mission-timer"></span></div>
            <div id="mission-obj"></div>
            <div id="mission-sub"></div>
            <div id="mission-stage"><span id="stage-label"></span>
                <div id="stage-bar"></div>
            </div>
            <div id="mission-next"></div>
        </div>
        <div id="dispatch" class="panel hidden">
            <div class="dh"><i></i>PCPD RESPONSE<span id="dispatch-count"></span></div>
            <div id="dispatch-rows"></div>
            <div id="dispatch-foot"></div>
        </div>
        <div id="top-right">
            <div id="clock"></div>
            <div id="money"></div>
            <div id="stars"></div>
            <div id="search"></div>
            <div id="weapons"></div>
        </div>
        <div id="wanted-banner" class="hidden"></div>
        <div id="radar-wrap"><canvas id="radar" width="240" height="240"></canvas>
            <div id="place"><b id="district"></b><span id="street"></span></div>
            <div id="bars"><i id="hp"></i><i id="ar"></i></div>
            <div id="respect"><b id="rep-level"></b>
                <div><span id="rep-title"></span>
                    <div class="rb"><i id="rep-bar"></i></div>
                </div><em id="rep-pts"></em></div>
        </div>
        <div id="vehicle-info" class="hidden">
            <div id="radio" class="panel"></div>
            <div id="car-card" class="panel">
                <div id="car-name"></div>
                <div class="cond"><span>CONDITION</span>
                    <div class="cb"><i id="car-cond"></i></div><b id="car-cond-pct"></b></div>
                <div class="spd">
                    <div id="speed"></div>
                    <div id="gear"></div>
                </div>
            </div>
        </div>
        <div id="dialogue" class="hidden"></div>
        <div id="toasts"></div>
        <div id="help"></div>
        <div id="crosshair" class="hidden"></div>
    </div>
    <div id="title" class="screen hidden"></div>
    <div id="pause" class="screen hidden"></div>
    <div id="shop" class="screen hidden"></div>
    <div id="fade" class="hidden"></div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
