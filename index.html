    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.configurable && desc.get && !desc.set) {
            var origGet = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: origGet,
              set: function () {},
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (src.indexOf('chrome-extension://') === 0 || stack.indexOf('chrome-extension://') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
